label{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}@media(max-width:640px){.f2{grid-template-columns:1fr}}

.fil{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}@media(max-width:760px){.fil{grid-template-columns:1fr 1fr}}.skel{height:260px;border-radius:16px;background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200%}}

const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN'),CATS=['Starters','Main Course','Indian Cuisine','Chinese Cuisine','Italian Cuisine','Pizza','Burgers','Desserts','Beverages','Special Offers'];
const STEPS=['Order Placed','Order Confirmed','Food Preparing','Ready for Pickup','Out for Delivery','Delivered'];
const M=[['paneer-tikka','Smoked Paneer Tikka','Starters',320,1,'Paneer, hung curd, kashmiri chilli, charred peppers, mint chutney.','🧆',4.6,1],['calamari','Crispy Calamari','Starters',380,0,'Squid, semolina crust, lemon aioli, smoked paprika.','🦑',4.4,0],['salmon','Grilled Atlantic Salmon','Main Course',790,0,'Salmon, lemon butter, asparagus, baby potatoes.','🐟',4.7,1],['peppers','Stuffed Bell Peppers','Main Course',540,1,'Peppers, quinoa, feta, roasted tomato sauce.','🫑',4.3,0],['butter-chicken','Butter Chicken','Indian Cuisine',460,0,'Tandoori chicken, tomato-cashew gravy, butter, fenugreek.','🍛',4.8,1],['dal-makhani','Dal Makhani','Indian Cuisine',340,1,'Black lentils, kidney beans, cream, slow-cooked overnight.','🍲',4.6,0],['noodles','Chilli Garlic Noodles','Chinese Cuisine',320,1,'Wok noodles, garlic, spring onion, chilli oil.','🍜',4.2,0],['kung-pao','Kung Pao Chicken','Chinese Cuisine',420,0,'Chicken, peanuts, dried chilli, Sichuan pepper.','🥡',4.4,0],['risotto','Truffle Mushroom Risotto','Italian Cuisine',520,1,'Arborio rice, wild mushrooms, parmesan, truffle oil.','🍚',4.7,1],['carbonara','Spaghetti Carbonara','Italian Cuisine',480,0,'Spaghetti, egg yolk, pecorino, crisp bacon.','🍝',4.5,0],['margherita','Napoletana Margherita','Pizza',450,1,'San Marzano tomato, buffalo mozzarella, basil.','🍕',4.6,0],['pepperoni','Pepperoni Pizza','Pizza',560,0,'Mozzarella, spicy pepperoni, chilli honey.','🍕',4.5,0],['smash','Classic Smash Burger','Burgers',390,0,'Double patty, cheddar, pickles, house sauce, brioche.','🍔',4.6,1],['veg-burger','Crispy Veg Burger','Burgers',310,1,'Spiced vegetable patty, slaw, chipotle mayo.','🍔',4.1,0],['tiramisu','Tiramisu','Desserts',290,1,'Mascarpone, espresso, ladyfingers, cocoa.','🍰',4.8,0],['lava','Molten Chocolate Lava','Desserts',320,1,'Dark chocolate, vanilla bean ice cream.','🍫',4.7,0],['cold-brew','Cold Brew Coffee','Beverages',180,1,'18-hour cold brew, milk or tonic.','☕',4.3,0],['lime-soda','Fresh Lime Soda','Beverages',110,1,'Lime, mint, soda; sweet, salted or mixed.','🍋',4.2,0],['date-night','Date Night Combo','Special Offers',1290,0,'Two starters, two mains, one dessert to share.','🥂',4.9,1],['lunch-combo','Lunch Combo','Special Offers',399,1,'Main, side, and a drink. Weekdays 12–3.','🍱',4.4,0]];
const DEMO=M.map(a=>({id:a[0],name:a[1],cat:a[2],price:a[3],veg:a[4],desc:a[5],emoji:a[6],rating:a[7],feat:a[8],avail:1}));
let S={menu:[],load:1,err:'',db:null,uid:null,me:null,adm:false,demo:0,q:'',cat:'',veg:'',max:0,sort:'pop',fav:[],cart:[],coupon:null,otype:'Delivery',set:{tax:5,fee:40,free:500,tables:8},coupons:[],reviews:[],orders:[],res:[],aOrders:[],aRes:[],msgs:[],tab:'overview'};
try{S.fav=JSON.parse(localStorage.getItem('ros_f')||'[]');S.cart=JSON.parse(localStorage.getItem('ros_c')||'[]');const t=localStorage.getItem('ros_t');if(t)document.documentElement.dataset.theme=t}catch(e){}
$('#fwa').href='https://wa.me/'+WA;
const sv=()=>{try{localStorage.setItem('ros_c',JSON.stringify(S.cart));localStorage.setItem('ros_f',JSON.stringify(S.fav))}catch(e){}};
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#171717';r.dataset.theme=d?'light':'dark';try{localStorage.setItem('ros_t',r.dataset.theme)}catch(e){}}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}
const dish=id=>S.menu.find(x=>x.id===id),unit=(m,p)=>Math.round(m.price*(p==='Large'?1.4:1));
const rate=m=>{const r=S.reviews.filter(x=>x.dish===m.id);return r.length?{v:r.reduce((s,x)=>s+x.stars,0)/r.length,n:r.length}:{v:m.rating,n:0}};
const dt=m=>`<span class="dot ${m.veg?'v':'nv'}" title="${m.veg?'Vegetarian':'Non-vegetarian'}"></span>`;
function card(m){const r=rate(m);return `<article class="card"><div class="art">${esc(m.emoji||'🍽️')}</div><button class="hrt" aria-label="Favourite" onclick="tf('${m.id}')">${S.fav.includes(m.id)?'♥':'♡'}</button><div class="cb"><small class="mut">${dt(m)}${esc(m.cat)}</small><h3 style="font-size:19px">${esc(m.name)}</h3><p class="sm mut" style="margin:4px 0">${esc(m.desc)}</p><p class="sm">★ ${r.v.toFixed(1)}${r.n?' ('+r.n+')':''} · ${m.avail?'<span class="v">Available</span>':'<span class="err">Unavailable</span>'}</p><p class="pr">${inr(m.price)}</p><div class="row"><button class="btn s" ${m.avail?'':'disabled'} onclick="addC('${m.id}')">Add to Cart</button><button class="btn s g" onclick="dm('${m.id}')">View Details</button></div></div></article>`}
const grid=a=>a.length?`<div class="grid">${a.map(card).join('')}</div>`:'<div class="note">No dishes match your filters.</div>';
function tf(id){S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id];sv();upd();toast('Favourites updated')}
function addC(id,port='Regular',spice='',qty=1,note=''){const k=[id,port,spice,note].join('|'),i=S.cart.find(x=>x.k===k);i?i.qty+=qty:S.cart.push({k,id,port,spice,qty,note});sv();hdr();toast('Added to cart')}
function tot(){const L=S.cart.map(i=>({...i,m:dish(i.id)})).filter(i=>i.m),sub=L.reduce((s,i)=>s+unit(i.m,i.port)*i.qty,0),c=S.coupon;let d=0;if(c&&sub>=(+c.min||0))d=c.type==='pct'?Math.round(sub*c.value/100):Math.min(+c.value,sub);const tax=Math.round((sub-d)*S.set.tax/100),fee=S.otype==='Delivery'&&sub>0&&sub<S.set.free?S.set.fee:0;return{L,sub,d,tax,fee,total:sub-d+tax+fee}}
function hdr(){const n=S.cart.reduce((s,i)=>s+i.qty,0);$('#cn').textContent=n?'('+n+')':''}
function dm(id){const m=dish(id),rv=S.reviews.filter(x=>x.dish===id).slice(0,3),o=document.createElement('div');o.className='ov';o.onclick=e=>{if(e.target===o)o.remove()};
o.innerHTML=`<div class="md" role="dialog" aria-label="${esc(m.name)}"><div class="art" style="border-radius:14px;height:170px;font-size:84px">${esc(m.emoji||'🍽️')}</div><p class="mut sm">${dt(m)}${esc(m.cat)}</p><h2 style="margin:0 0 6px">${esc(m.name)}</h2><p><b>About &amp; ingredients:</b> ${esc(m.desc)}</p><p class="pr" id="dp">${inr(m.price)}</p>
<div class="f2"><div><label>Portion</label><select id="dpo" onchange="dpr('${id}')"><option>Regular</option><option>Large</option></select></div><div><label>Quantity</label><input id="dq" type="number" min="1" max="20" value="1" oninput="dpr('${id}')"></div></div>${m.cat==='Beverages'||m.cat==='Desserts'?'':'<label>Spice level</label><select id="ds"><option>Medium</option><option>Mild</option><option>Hot</option></select>'}<label>Special instructions</label><textarea id="dn" rows="2" maxlength="200" placeholder="Allergies, no onions…"></textarea>
<div class="row"><button class="btn" ${m.avail?'':'disabled'} onclick="addD('${id}')">Add to Cart</button><button class="btn g" onclick="this.closest('.ov').remove()">Close</button></div>
<h3 style="margin-top:18px;font-size:18px">Reviews</h3>${rv.length?rv.map(r=>`<p class="sm">${'★'.repeat(r.stars)} ${esc(r.text)}</p>`).join(''):'<p class="sm mut">No reviews yet.</p>'}
<form onsubmit="rvw(event,'${id}')"><label>Rate this dish</label><div class="f2"><select name="stars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><input name="text" maxlength="200" placeholder="Short review"></div><button class="btn s g">Submit review</button> <span class="sm" id="rvm"></span></form></div>`;document.body.appendChild(o)}
function dpr(id){const m=dish(id);$('#dp').textContent=inr(unit(m,$('#dpo').value)*Math.max(1,+$('#dq').value||1))}
function addD(id){const q=Math.min(20,Math.max(1,+$('#dq').value||1));addC(id,$('#dpo').value,$('#ds')?$('#ds').value:'',q,$('#dn').value.trim());document.querySelector('.ov').remove()}
async function rvw(e,id){e.preventDefault();const f=e.target,b=$('#rvm');if(!f.text.value.trim()){b.textContent='Write a few words first.';return}if(!S.db||!S.uid){b.textContent='Sign in on claude.ai to review.';return}try{await S.db.collection('reviews').add({dish:id,uid:S.uid,stars:+f.stars.value,text:f.text.value.trim(),ts:Date.now()});b.textContent='Thanks for your review!';f.reset()}catch(x){b.textContent='Could not save review.'}}
function home(){const f=S.menu.filter(m=>m.feat&&m.avail).slice(0,4);return `<section class="hero"><div class="wrap"><p class="eb">Fine dining · Online ordering · Reservations</p><h1>Taste the season, your way.</h1><p>Slow-cooked classics and bold modern plates, served at our table or delivered to your door.</p><div class="row"><a class="btn" href="#menu">Explore Menu</a><a class="btn g" style="color:#F8F3EA" href="#reserve">Book a Table</a><a class="btn g" style="color:#F8F3EA" href="#menu">Order Online</a></div></div></section>
<div class="wrap"><section class="sec"><p class="eb">Featured</p><h2>Signature dishes</h2>${grid(f)}</section>

<section class="sec split"><div><p class="eb">FAQ</p><h2>Good to know</h2>${[['Do you deliver?','Yes. Delivery fee and free-delivery threshold are shown in your cart.'],['Can I pay online?','Cash on delivery is available now. Card and UPI are not yet enabled.'],['How do reservations work?','Submit a request; the restaurant approves it and your status updates on the reservation page.']].map(x=>`<details><summary>${x[0]}</summary><p class="mut">${x[1]}</p></details>`).join('')}</div>

inbox:()=>S.msgs.length?S.msgs.map(m=>`<div class="box" style="margin-bottom:8px"><b>${esc(m.kind)}</b> · ${esc(m.name)} · ${esc(m.email)}<p class="sm">${esc(m.message)}</p><button class="chip" onclick="S.db.collection('msgs').doc('${m.id}').delete()">Delete</button></div>`).join(''):'<p class="mut">No messages or subscribers yet.</p>',
settings:()=>`<form class="box" onsubmit="setS(event)"><div class="f2"><div><label>Tax %</label><input name="tax" type="number" step=".1" value="${S.set.tax}"></div><div><label>Delivery fee ₹</label><input name="fee" type="number" value="${S.set.fee}"></div><div><label>Free delivery above ₹</label><input name="free" type="number" value="${S.set.free}"></div><div><label>Tables per time slot</label><input name="tables" type="number" value="${S.set.tables}"></div></div><button class="btn s">Save settings</button></form><p class="sm mut">Logo upload, opening-hour editing, homepage content and social links are not built yet.</p>`})[t]();
return `<div class="wrap sec"><p class="eb">Admin</p><h2>Dashboard</h2><div class="chips">${T.map(t=>`<button class="chip ${S.tab===t?'on':''}" onclick="S.tab='${t}';route(1)">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${B(S.tab)}</div>`}
function route(keep){const h=(location.hash||'#home').slice(1),R={home,menu,cart:cartV,checkout:chkV,reserve:resV,orders:ordV,account:accV,admin:admV};if(!R[h]){location.hash='home';return}
const y=scrollY,a=document.activeElement;$('#app').innerHTML=R[h]();document.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x.dataset.r===h));hdr();if(h==='menu')upd();$('#links').classList.remove('open');keep?scrollTo(0,y):scrollTo(0,0);document.title=({menu:'Menu',cart:'Cart',checkout:'Checkout',reserve:'Reserve a Table',orders:'My Orders',account:'Account',admin:'Admin'}[h]||'RestaurantOS — Fine Dining')+(h==='home'?'':' — RestaurantOS')}
addEventListener('hashchange',()=>route());
function useDemo(){S.load=0;S.demo=1;S.menu=DEMO;route(1)}
const L=(db,c,k,q,after)=>(q||db.collection(c)).onSnapshot(s=>{S[k]=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(b.ts||0)-(a.ts||0));if(after)after();const h=location.hash;if(!['#menu','#home','#reserve',''].includes(h)||h==='#reserve'&&0)route(1);else if(h==='#home'||h==='')route(1)},()=>{});
async function init(){route();const t=setTimeout(()=>{if(S.load)useDemo()},8000);
try{const db=await claude.use('db');clearTimeout(t);if(!db){useDemo();return}S.db=db;
try{const u=await claude.use('user');if(u){S.me=await u.me();S.uid=S.me&&S.me.id;S.adm=!!await u.canEdit()}}catch(e){}
db.collection('menu').onSnapshot(s=>{S.load=0;S.err='';const a=s.docs.map(d=>({...d.data(),id:d.id}));S.demo=!a.length;S.menu=a.length?a:DEMO;const h=location.hash;if(h==='#menu')upd();else route(1)},e=>{S.err=e.message;useDemo()});
db.collection('coupons').onSnapshot(s=>{S.coupons=s.docs.map(d=>({...d.data(),id:d.id}))},()=>{});db.collection('reviews').onSnapshot(s=>{S.reviews=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>b.ts-a.ts)},()=>{});
db.doc('settings/main').onSnapshot(s=>{if(s.exists)S.set={...S.set,...s.data()}},()=>{});
if(S.uid){L(db,'orders','orders',db.collection('orders').where('uid','==',S.uid));L(db,'reservations','res',db.collection('reservations').where('uid','==',S.uid))}
if(S.adm){L(db,'orders','aOrders');L(db,'reservations','aRes');L(db,'msgs','msgs')}}catch(e){clearTimeout(t);useDemo()}}
init();
</script></body></html>
